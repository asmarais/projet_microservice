spring.application.name=inventory-service
spring.config.import=configserver:${CONFIG_SERVER_URL:http://localhost:8888}
server.port=${INVENTORY_SERVICE_PORT:8083}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.health.group.readiness.include=readinessState,db
spring.cloud.openfeign.client.config.product-service.connectTimeout=2000
spring.cloud.openfeign.client.config.product-service.readTimeout=3000
