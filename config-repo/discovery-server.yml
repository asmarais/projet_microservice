spring:
  application:
    name: discovery-server
server:
  port: ${EUREKA_SERVER_PORT:8761}

eureka:
  dashboard:
    enabled: true
  client:
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}
