spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: false
          routes:
            # Product Service routes
            - id: product-service
              order: -1
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/produits/**
              filters:
                - StripPrefix=1

            - id: category-service
              order: -1
              uri: lb://PRODUCT-SERVICE
              predicates:
                - Path=/api/categories-produits/**
              filters:
                - StripPrefix=1

            # Monolith fallback
            - id: monolith-fallback
              order: 0
              uri: ${MONOLITH_BASE_URL:http://localhost:8089}
              predicates:
                - Path=/api/**
              filters:
                - StripPrefix=1

server:
  port: ${API_GATEWAY_PORT:8080}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}
