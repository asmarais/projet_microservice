spring:
  application:
    name: supplier-service
  datasource:
    url: ${SUPPLIER_DB_URL:jdbc:mysql://localhost:3306/supplier_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${SUPPLIER_DB_USERNAME:root}
    password: ${SUPPLIER_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SUPPLIER_SERVICE_PORT:8084}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
