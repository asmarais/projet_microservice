spring:
  application:
    name: procurement-service
  datasource:
    url: ${PROCUREMENT_DB_URL:jdbc:mysql://localhost:3306/procurement_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${PROCUREMENT_DB_USERNAME:root}
    password: ${PROCUREMENT_DB_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          supplier-service:
            connectTimeout: 2000
            readTimeout: 3000
          product-service:
            connectTimeout: 2000
            readTimeout: 3000
          user-service:
            connectTimeout: 2000
            readTimeout: 3000

server:
  port: ${PROCUREMENT_SERVICE_PORT:8086}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db
